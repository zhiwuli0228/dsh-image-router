# dsh-image-router — configuration examples.
#
# The package's own patch layer inserts the loader entry with no config, so every
# value below is an override you add to YOUR layer:
#
#   $DSH_HOME/profiles/<name>/cordis.patch.yml   (per profile)
#   $DSH_HOME/cordis.patch.yml                   (every profile)
#
# A config override REPLACES the whole config object — repeat every key you want
# to keep. Without a `vision` route the plugin still activates and disables
# itself with a readable warning, so nothing here is load-bearing for the boot.
#
# ── 1. Minimal: images are digested to text, session model untouched ──────────
- id: image-router
  config:
    mode: digest
    vision:
      provider: qwen-token-plan-cn
      model: qwen3.8-flash

# ── 2. Everything a digest deployment can tune ────────────────────────────────
# - id: image-router
#   config:
#     enabled: true
#     mode: digest
#     vision:
#       provider: qwen-token-plan-cn
#       model: qwen3.8-flash
#       # optional: reasoningEffort: high
#     # What the vision model is asked for; defaults to transcript + description.
#     instruction: |
#       逐字转录图中所有可见文字，包括按钮、标签、文件名、统计数字与时间戳；
#       然后客观描述画面结构。不要省略任何界面元素。
#     maxTokens: 900
#     timeoutMs: 120000
#     # Prefix the replacement text with `[图片分析 · provider/model]`.
#     label: true
#     # Register the `describe_image` tool (image paths, works on text-only models).
#     tool: true
#     # Audit every decision to this file.
#     traceFile: '/home/me/.dsh/image-router.log'
#     # Log decisions without calling the vision model.
#     dryRun: false

# ── 3. Opt-in legacy policy: lend the session route for image turns ───────────
# - id: image-router
#   config:
#     mode: switch
#     vision:
#       provider: qwen-token-plan-cn
#       model: qwen3.8-flash
#     text:
#       provider: deepseek-official
#       model: deepseek-flash
#     holdTurns: 1
#     imageExtensions: [png, jpg, jpeg, webp, gif]
#     hint: '截图|screenshot'

# ── 4. Development: mount the plugin source directly, no install ──────────────
# Replace the package name with the path to lib/index.js. Absolute and ./-relative
# paths are accepted in an insert row (the loader turns them into file URLs).
# - insert:
#     - id: image-router
#       name: './dsh-image-router/lib/index.js'
#       config:
#         vision:
#           provider: qwen-token-plan-cn
#           model: qwen3.8-flash
