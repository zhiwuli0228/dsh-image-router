# CI for dsh-vision-router: the plugin is plain ESM with no runtime dependencies,
# so the whole suite runs on stock Node without installing anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No path argument: Node's own discovery finds test/**/*.test.js on 20, 22
      # and 24. A directory argument is NOT portable — Node 22+ takes `test/` as a
      # single entry file and fails to load it, which is exactly what CI caught.
      - name: Run the suite
        run: node --test
      - name: Run the suite in-process
        run: node test/routing.test.js

  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A bundle plugin is only loadable if its manifest points at a patch file
      # that exists and parses, so guard the packaging contract itself.
      - name: Check the bundle manifest
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
            const patch = manifest.dsh?.bundle?.patch
            if (typeof patch !== 'string') throw new Error('package.json must declare dsh.bundle.patch')
            readFileSync(patch, 'utf8')
            const entry = readFileSync('lib/index.js', 'utf8')
            for (const token of ['export const name', 'export const Config', 'export function apply']) {
              if (!entry.includes(token)) throw new Error('lib/index.js is missing ' + token)
            }
            // A declared browser half must export a bundle dsh-client-modules can
            // read, which is exactly the check it throws on at runtime.
            if (manifest.dsh?.client !== undefined) {
              const client = manifest.exports?.['./client']
              if (typeof client !== 'string') throw new Error('dsh.client requires a string exports["./client"]')
              readFileSync(client, 'utf8')
            }
            console.log('manifest ok:', manifest.name, manifest.version, '->', patch)
          "
