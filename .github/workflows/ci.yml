# CI for dsh-vision-router: the plugin is plain ESM with no runtime dependencies,
# so the whole suite runs on stock Node without installing anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No path argument: Node's own discovery finds test/**/*.test.js on 20, 22
      # and 24. A directory argument is NOT portable — Node 22+ takes `test/` as a
      # single entry file and fails to load it, which is exactly what CI caught.
      - name: Run the suite
        run: node --test
      - name: Run the suite in-process
        run: node test/routing.test.js

  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A bundle plugin is only loadable if its manifest points at a patch file
      # that exists and parses, so guard the packaging contract itself.
      - name: Check the bundle manifest
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
            const patch = manifest.dsh?.bundle?.patch
            if (typeof patch !== 'string') throw new Error('package.json must declare dsh.bundle.patch')
            readFileSync(patch, 'utf8')
            // A declared browser half must export a bundle dsh-client-modules can
            // read, which is exactly the check it throws on at runtime.
            if (manifest.dsh?.client !== undefined) {
              const client = manifest.exports?.['./client']
              if (typeof client !== 'string') throw new Error('dsh.client requires a string exports["./client"]')
              readFileSync(client, 'utf8')
            }
            console.log('manifest ok:', manifest.name, manifest.version, '->', patch)
          "

      # The entry's exports are what the loader actually consumes, so import the
      # module and check them instead of grepping the source. This entry derives
      # `Config` from a top-level await (the schema is dual-form), so it re-exports a
      # binding rather than declaring `export const Config` -- a text match reported
      # that as missing, and this job failed on every run since.
      - name: Check the entry exports
        run: |
          node --input-type=module -e "
            const mod = await import('./lib/index.js')
            if (typeof mod.name !== 'string' || mod.name.length === 0) throw new Error('the entry must export a non-empty name')
            if (mod.default !== undefined) throw new Error('a DSH plugin entry must not have a default export')
            if (mod.Config === undefined) throw new Error('the entry must export Config')
            if (typeof mod.apply !== 'function') throw new Error('the entry must export apply')
            for (const method of ['toJSON', 'safeParse']) {
              if (typeof mod.Config[method] !== 'function') throw new Error('Config must answer ' + method + '(), which the settings service calls')
            }
            if (typeof mod.Config({ mode: 'digest' }) !== 'object') throw new Error('Config must be callable to layer defaults')
            console.log('entry ok:', mod.name, '| schema form:', mod.schemaForm)
          "
