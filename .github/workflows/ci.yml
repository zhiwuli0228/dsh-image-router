# CI for dsh-vision-router: the plugin is plain ESM with no runtime dependencies,
# so the whole suite runs on stock Node without installing anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No path argument: Node's own discovery finds test/**/*.test.js on 20, 22
      # and 24. A directory argument is NOT portable — Node 22+ takes `test/` as a
      # single entry file and fails to load it, which is exactly what CI caught.
      - name: Run the suite
        run: node --test
      - name: Run the suite in-process
        run: node test/routing.test.js

  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The packaging contract lives in one script so this job and release.yml cannot
      # drift apart, and so a contributor can run exactly what CI runs:
      #   node tools/check-contract.mjs
      #
      # It guards four things: the declared patch file exists, a declared browser half
      # exports a readable bundle, the entry exports what the loader consumes (with
      # `Config` answering the three consumers that read it), and -- new here -- that
      # the README's "current version" line still matches package.json. Those are two
      # hand-edited files; the npm page renders one while the registry serves the other,
      # and nothing else would notice them drifting.
      #
      # The assertions are the contract BOTH schema forms satisfy. `safeParse` is not
      # among them: the zero-dependency fallback happens to provide it but the real
      # schemastery does not, so asserting it tested the fallback's private surface and
      # would have failed in any environment that resolves schemastery. What the three
      # consumers actually call is: Cordis -> `~standard.validate`, the settings service
      # `resolve()` -> the schema itself, `describe()` -> `toJSON()`.
      - name: Check the packaging contract
        run: node tools/check-contract.mjs
