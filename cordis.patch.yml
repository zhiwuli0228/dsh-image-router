# dsh-vision-router profile patch layer — insert one loader entry for the plugin
# package, exactly like the shipped plugin bundles. The entry is a normal cordis
# loader entry (id + package name); every default lives in the package's own
# `Config` schema, so this layer stays deployment-neutral.
#
# Configure it where you mount it — either in the profile's own cordis.patch.yml
# as a same-id override, or in `$DSH_HOME/settings.yaml`. See the README:
# without a `vision` route the plugin activates and disables itself with a
# readable warning, so a bare mount is safe.
- insert:
    - id: vision-router
      name: 'dsh-vision-router'
